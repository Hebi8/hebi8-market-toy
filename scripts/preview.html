<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hebi8 外汇回放 · Toy 预览</title>
  <link rel="icon" href="/toy/hebi8-fx-preview/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #16181b; color: #eee; font: 14px system-ui, sans-serif; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px; }
    header strong { margin-right: auto; }
    button, a { border: 1px solid #444; border-radius: 7px; padding: 8px 12px; color: inherit; background: #222; text-decoration: none; cursor: pointer; font: inherit; }
    button[aria-pressed="true"] { border-color: #e8b339; color: #e8b339; }
    p { margin: 0 20px 16px; color: #aaa; font-size: 12px; }
    main { display: flex; justify-content: center; padding: 0 16px 16px; }
    iframe { display: block; width: 100%; height: calc(100dvh - 115px); border: 1px solid #414149; border-radius: 10px; background: #0b0e11; }
    iframe.phone { width: 390px; height: 844px; max-width: 100%; }
    iframe.half { width: 360px; height: 400px; max-width: 100%; }
  </style>
</head>
<body>
  <header>
    <strong>hebi8 外汇回放 · Toy 预览</strong>
    <button type="button" data-mode="desktop" aria-pressed="true">桌面</button>
    <button type="button" data-mode="phone" aria-pressed="false">手机全屏 · 390×844</button>
    <button type="button" data-mode="half" aria-pressed="false">视频下方半屏 · 360×400</button>
    <a href="/toy/hebi8-fx-preview/index.html" target="_blank" rel="noopener">直接打开</a>
  </header>
  <p>这里不模拟 B 站容器：账号、云存档和排行榜要在 Toy 里实测，本地用 localStorage 和本机最好成绩代替。</p>
  <main><iframe title="游戏预览" src="/toy/hebi8-fx-preview/index.html"></iframe></main>
  <script>
    for (const button of document.querySelectorAll('[data-mode]')) {
      button.addEventListener('click', () => {
        document.querySelector('iframe').className = button.dataset.mode === 'desktop' ? '' : button.dataset.mode;
        for (const item of document.querySelectorAll('[data-mode]')) item.setAttribute('aria-pressed', String(item === button));
      });
    }
  </script>
</body>
</html>
